# Steamix's CI. This file is the canonical copy and moves with Steamix when
# it gets its own repository.
#
# GitHub only loads workflows that are regular files under the repository's
# root .github/workflows, and does not follow symlinks there (a symlinked
# workflow fails to run; github.com/orgs/community/discussions/109744). So
# .github/workflows/steamix.yaml at the root is a byte-for-byte copy of this
# file, and the first step below fails the run if the two ever differ. Edit
# this one, then:
#
#   cp steamix/.github/workflows/steamix.yaml .github/workflows/steamix.yaml
name: Steamix VM tests
on:
  workflow_dispatch:
  # Only Steamix's own changes run this, so unrelated work in the repository
  # never produces a Steamix notification. That includes this workflow: its
  # canonical copy is under steamix/, so editing it is a Steamix change.
  # The trade-off, chosen on purpose: a nixpkgs bump that breaks Steamix
  # shows up on the next Steamix change, or a manual run, not the same night.
  push:
    paths:
      - "steamix/**"

jobs:
  vm-test:
    name: ${{ matrix.test }} (${{ matrix.channel.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One failing test or channel must not hide the others: the two
      # channels have already disagreed about greetd's PAM stack.
      fail-fast: false
      matrix:
        test: [greetd, sddm, steamos-manager, decky-loader]
        # The tests are the Steamix flake's own `checks`. Its nixpkgs input
        # is pinned to one this repository locks, so a run is reproducible
        # and matches what the hosts get: `--inputs-from .` makes the
        # parent's locked inputs resolvable by name, and --override-input
        # points Steamix's nixpkgs at one of them.
        #   stable:   the nixpkgs the hosts run
        #   unstable: the channel Steamix's own flake follows
        channel:
          - { name: stable, input: nixpkgs }
          - { name: unstable, input: nixpkgs-unstable }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Root workflow is a copy of Steamix's
        run: |
          cmp steamix/.github/workflows/steamix.yaml .github/workflows/steamix.yaml || {
            echo "::error file=.github/workflows/steamix.yaml::differs from steamix/.github/workflows/steamix.yaml, the canonical copy. Run: cp steamix/.github/workflows/steamix.yaml .github/workflows/steamix.yaml"
            exit 1
          }
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          logger: pretty
          # Hands the runner's /dev/kvm to the Nix daemon; without it the
          # test driver falls back to emulation and takes many times longer.
          kvm: true
      - name: Pull from the Steamix cache
        uses: cachix/cachix-action@v17
        with:
          name: steamix
          # Tests never push: only the cache job below does, and only what
          # passed them.
          skipPush: true
      - name: Run ${{ matrix.test }} against ${{ matrix.channel.name }}
        run: >-
          nix build -L --no-write-lock-file
          --inputs-from .
          --override-input nixpkgs ${{ matrix.channel.input }}
          ./steamix#checks.x86_64-linux.${{ matrix.test }}

  # Fill steamix.cachix.org with what a Steamix machine would otherwise
  # compile itself: the steamix flake's `cache` set (SteamOS Manager, Decky
  # Loader, the 32-bit gamescope WSI layer), built against the same pinned
  # nixpkgs revisions as the tests, so those are exactly the store paths a
  # machine on those revisions asks for. Runs on main only, after every test
  # passed. Pushes only those outputs and their runtime closures (cachix
  # skips what cache.nixos.org has), never build-only paths such as fetched
  # sources, and pins each so the free tier's garbage collection keeps them.
  cache:
    name: cache (${{ matrix.channel.name }})
    needs: vm-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        channel:
          - { name: stable, input: nixpkgs }
          - { name: unstable, input: nixpkgs-unstable }
    env:
      # A repository secret holding a Cachix auth token with write access to
      # the steamix cache. Without it the job builds and skips the push.
      CACHIX_AUTH_TOKEN: ${{ secrets.STEAMIX_CACHIX_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          logger: pretty
      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: steamix
          authToken: ${{ secrets.STEAMIX_CACHIX_AUTH_TOKEN }}
          # Pushed explicitly below, so that build-only paths stay out.
          skipPush: true
      - name: Build the cached set against ${{ matrix.channel.name }}
        run: |
          pin="--no-write-lock-file --inputs-from . --override-input nixpkgs ${{ matrix.channel.input }}"
          : > outputs
          for attr in $(nix eval --raw $pin ./steamix#cache --apply 'c: toString (builtins.attrNames c)'); do
            path=$(nix build -L --no-link --print-out-paths $pin "./steamix#cache.$attr")
            echo "$attr $path" | tee -a outputs
          done
      - name: Push and pin
        if: env.CACHIX_AUTH_TOKEN != ''
        run: |
          while read -r attr path; do
            cachix push steamix "$path"
            cachix pin steamix "$attr-${{ matrix.channel.name }}" "$path" --keep-revisions 3
          done < outputs
      - name: No token, nothing pushed
        if: env.CACHIX_AUTH_TOKEN == ''
        run: echo "::notice::STEAMIX_CACHIX_AUTH_TOKEN is not set; built the cached set but pushed nothing."
