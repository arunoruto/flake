default_stages:
  - pre-commit
repos:
  - repo: local
    hooks:
      - id: nix-fmt
        name: nix fmt
        entry: nix
        args: ["fmt", "--", "--check"]
        language: system
        files: '\.nix$'
        pass_filenames: false
      - id: new-package-attrs
        name: new packages set structuredAttrs/strictDeps
        entry: ./scripts/check-new-packages.sh
        language: script
        files: 'packages/.*/package\.nix$'
